# Локальне середовище розробки.
# Запуск з кореня репозиторію: docker compose -f infra/compose.yaml up
name: logistics

services:
  app:
    build:
      context: ./php
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    ports:
      - "8000:8000"
    environment:
      # Змінні оточення мають пріоритет над backend/.env
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: logistics
      DB_USERNAME: logistics
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
